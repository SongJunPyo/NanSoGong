[pytest]
# ai 폴더에서 pytest 를 실행하면 app 패키지를 바로 찾는다
pythonpath = .
testpaths = tests
filterwarnings =
    # FastAPI 0.115 가 요청 본문 모델의 camelCase 별칭을 다시 읽을 때 Pydantic 2.12+ 가 내는 경고. 동작에는 영향 없다
    # (test_job_routes.py 가 camelCase 입출력을 확인한다). 라이브러리 버전을 최종 고정할 때 새 FastAPI 로 확인하고 이 줄을 지운다
    ignore:The '(alias|validation_alias|serialization_alias)' attribute with value:pydantic.warnings.UnsupportedFieldAttributeWarning
