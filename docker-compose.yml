# 🐳 로컬 개발 환경. 팀원 6명이 모두 "같은 버전의 서버 · PostgreSQL · Redis · 목업" 을 쓰게 만드는 파일
#   docker compose up -d                          → 서버(8080) + PostgreSQL + Redis + 외부 연동 목업(8089)
#                                                   서버는 backend 코드로 이미지를 만들어 띄운다 (코드가 바뀌면 자동으로 다시 빌드)
#   docker compose logs -f app                    → 서버 로그 보기 (Ctrl+C 로 나가도 서버는 계속 돈다)
#   docker compose --profile monitoring up -d     → + Prometheus(9090) + Grafana(3000)
#   docker compose --profile ml up -d             → + 수요 예측용 Jupyter(8888)
#   docker compose --profile ai up -d --build     → + AI 서비스 FastAPI(8001) (ai/README.md)
#   docker compose --profile ai --profile ai-worker up -d --build  → + AI 작업 저장소 준비 · AI 워커 (내 PC 전용)
#   docker compose --profile web up -d --build    → + 배포 모양 화면 nginx(8000) (AWS dev EC2 는 docker-compose.dev.yml 로 항상 켬)
# 🧑‍💻 서버 코드를 고치며 디버깅할 때는 VS Code "서버 (Spring Boot, 8080)" 로 실행한다
#     → 실행 전에 컨테이너 서버(app)를 자동으로 멈추고 DB · Redis · 목업만 띄운다 (8080 충돌 방지)
#     손으로 하려면: docker compose stop app  →  backend 에서 gradlew bootRun
#   docker compose down                           → 끄기 (데이터는 볼륨에 남는다)
#   docker compose down -v                        → 끄고 데이터까지 삭제 (DB 를 처음 상태로)
# 값은 같은 폴더의 .env 에서 읽는다 (.env.example 을 복사해서 만든다)
# 🚨 버전은 운영(RDS · ElastiCache)과 테스트(TestcontainersConfig)와 맞춘다. 바꿀 때는 세 곳을 함께 바꾼다
name: nansogong

# AI 서비스 이미지 (ai-migrate · ai-worker 가 같이 쓴다. ai-api 와 같은 이미지)
x-ai-image: &ai-image
  build: ./ai
  image: nansogong-ai:local
  pull_policy: build

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-nansogong}
      POSTGRES_USER: ${DB_USER:-dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev}
      TZ: Asia/Seoul                        # DB 처음 만들 때 기본 timezone 이 한국 시간이 된다 (RDS 는 파라미터 그룹 timezone=Asia/Seoul)
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data     # 컨테이너를 지워도 데이터는 남는다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dev} -d ${DB_NAME:-nansogong}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.0-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 🎭 외부 연동 목업: 국세청 · 기상청 · 특일 · 네이버 데이터랩 · POS · 가상 거래처 · 마이데이터 (mock/README.md)
  #    API 키 없이도 모든 연동 기능을 개발할 수 있다. 응답은 mock/mappings/*.json 이 정한다
  mock:
    image: wiremock/wiremock:3.13.2
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "${MOCK_PORT:-8089}:8080"
    volumes:
      - ./mock/mappings:/home/wiremock/mappings:ro
    environment:
      TZ: Asia/Seoul

  # 🌱 Spring 서버 (backend/Dockerfile 로 빌드). JDK · IDE 없이도 서버가 뜬다
  #    pull_policy: build → up 할 때마다 빌드를 확인한다. 코드가 그대로면 캐시로 몇 초, 바뀌었으면 다시 컴파일
  app:
    build: ./backend
    image: nansogong-api:local
    pull_policy: build
    ports:
      - "8080:8080"
    environment:
      # 회원 인증: 실제 값은 환경변수/Secrets에서만 전달한다.
      VERIFICATION_MODE: ${VERIFICATION_MODE:-mock}
      SENS_SERVICE_ID: ${SENS_SERVICE_ID:-}
      SENS_ACCESS_KEY: ${SENS_ACCESS_KEY:-}
      SENS_SECRET_KEY: ${SENS_SECRET_KEY:-}
      SENS_FROM: ${SENS_FROM:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # .env 에 DB_URL 이 있으면 그 DB(팀 공용 온프레미스 DB 등)에 붙는다. bootRun 과 같은 DB 를 쓴다
      # 없으면 같은 compose 의 postgres 컨테이너에 붙는다. AWS dev EC2 가 어느 DB 에 붙는지는 docker-compose.dev.yml 을 본다
      # 컨테이너끼리는 서비스 이름으로 부른다 (localhost 가 아니다). 🚨 .env 의 DB_URL 에 localhost 를 쓰면 컨테이너 안에서는 연결되지 않는다
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/${DB_NAME:-nansogong}}
      DB_USER: ${DB_USER:-dev}
      DB_PASSWORD: ${DB_PASSWORD:-dev}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NTS_BASE_URL: ${NTS_BASE_URL:-http://mock:8080/nts/v1}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-mock-key}
      KMA_BASE_URL: ${KMA_BASE_URL:-http://mock:8080/kma}
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY:-mock-key}
      KAKAO_BASE_URL: ${KAKAO_BASE_URL:-http://mock:8080/kakao}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-mock-key}
      HOLIDAY_BASE_URL: ${HOLIDAY_BASE_URL:-http://mock:8080/holiday}
      TOUR_BASE_URL: ${TOUR_BASE_URL:-http://mock:8080/tour}
      NAVER_DATALAB_BASE_URL: http://mock:8080/naver/v1/datalab
      POS_BASE_URL: http://mock:8080/pos/v1
      SUPPLIER_BASE_URL: http://mock:8080/supplier/v1
      MYDATA_BASE_URL: http://mock:8080/mydata/v1
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-no-key}
      # 🤖 Python AI 워커 → Spring 내부 API(/internal/**) 토큰. 비어 있으면 내부 API 는 모두 401 (일반 기능은 영향 없음)
      #    dev EC2 는 nansogong/dev 비밀 → .env 로 들어온 값을 쓴다 (infra/secrets/README.md)
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock:
        condition: service_started
    # 처음 빌드는 라이브러리를 받느라 몇 분 걸린다. 진행 상황: docker compose logs -f app

  # 🖥️ (선택) 화면을 배포 모양 그대로: npm run build 결과를 nginx 가 서빙하고 /api 는 app 으로 넘긴다 (frontend/Dockerfile)
  #    평소 개발은 npm run dev(5173). PWA 설치 · 서비스워커 · 배포 빌드를 확인할 때만 쓴다 → http://localhost:8000
  #    AWS dev EC2 에서는 docker-compose.dev.yml 이 이 컨테이너를 80 포트로 항상 띄운다
  web:
    build: ./frontend
    image: nansogong-web:local
    profiles: ["web"]
    ports:
      - "${WEB_PORT:-8000}:80"
    depends_on:
      - app

  # 🧠 (선택) AI 서비스 (ai/Dockerfile, ai/README.md). 같은 이미지로 API 서버 · 표 만들기 · 워커를 띄운다
  #    Spring(app) 은 http://ai-api:8000 으로 부른다. 내 PC 에서는 http://localhost:8001 (8000 은 web 프로필이 쓴다)
  #    토큰 두 개는 서로 다른 값을 쓴다: AI_SERVICE_TOKEN(Spring → Python) · INTERNAL_API_TOKEN(Python → Spring). 값은 .env
  #    ai 프로필은 AWS dev EC2 도 켠다 (API 서버만). 아래 ai-worker 프로필은 내 PC 전용이다
  ai-api:
    build: ./ai
    image: nansogong-ai:local
    pull_policy: build
    profiles: ["ai"]
    ports:
      - "${AI_PORT:-8001}:8000"
    environment:
      # 비어 있으면 작업 API 만 401(토큰) · 503(저장소)이고 /health · /metrics 는 그대로 동작한다
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_DATABASE_URL: ${AI_DATABASE_URL:-}

  # 🧠 (선택, 내 PC 전용) ai-worker 프로필: ① 저장소 준비 → ② 표 만들기 → ③ 워커 순서로 뜬다
  #    dev EC2 에는 아직 띄우지 않는다 (Spring 이 Python 을 부르는 코드가 생기면 dev 배포를 따로 한다)
  #    ① ai-db-init: postgres 컨테이너에 Python 전용 계정(ai_app) · ai 스키마 (infra/ai-db/init.sql). 여러 번 해도 결과가 같다
  ai-db-init:
    image: postgres:17-alpine
    profiles: ["ai-worker"]
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-dev}
      PGPASSWORD: ${DB_PASSWORD:-dev}
      PGDATABASE: ${DB_NAME:-nansogong}
      AI_DB_USER: ${AI_DB_USER:-ai_app}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-}           # 비밀번호는 환경변수로만 넘긴다 (명령줄 · 로그에 남지 않게)
    volumes:
      - ./infra/ai-db/init.sql:/init.sql:ro
    command:
      - sh
      - -c
      - '[ -n "$$AI_DB_PASSWORD" ] || { echo "AI_DB_PASSWORD 가 없습니다 (.env.example 참고)"; exit 1; }; psql -X -q -v ON_ERROR_STOP=1 -v ai_user="$$AI_DB_USER" -f /init.sql'
    depends_on:
      postgres:
        condition: service_healthy

  #    ② ai-migrate: ai 스키마 표 만들기 · 올리기 (python -m app.db.migrate). 끝나면 멈춘다
  ai-migrate:
    <<: *ai-image
    profiles: ["ai-worker"]
    command: ["python", "-m", "app.db.migrate"]
    healthcheck:
      disable: true                                 # 이미지의 /health 검사는 API 서버용
    environment:
      AI_DATABASE_URL: ${AI_DATABASE_URL:-}
    depends_on:
      ai-db-init:
        condition: service_completed_successfully

  #    ③ ai-worker: 작업을 받아 처리 (python -m app.worker). 필요한 환경변수가 없으면 이름만 알려 주고 멈춘다
  #      실제 Claude 를 부르므로 ANTHROPIC_API_KEY 가 필요하다 (과금). LangSmith 추적은 LANGSMITH_TRACING=true 일 때만
  #      VS Code 로 Spring 을 띄울 때: .env 에 SPRING_BASE_URL=http://host.docker.internal:8080 을 넣고
  #        docker compose --profile ai --profile ai-worker up -d --build ai-api ai-worker   ← 서비스 이름을 적어야 app 컨테이너가 같이 뜨지 않는다
  #      app 을 기다리지 않는다 (service_started 는 Spring 준비 완료를 보장하지 않고, VS Code 로 띄울 때는 app 이 없다)
  ai-worker:
    <<: *ai-image
    profiles: ["ai-worker"]
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    environment:
      AI_DATABASE_URL: ${AI_DATABASE_URL:-}
      SPRING_BASE_URL: ${SPRING_BASE_URL:-http://app:8080}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-nansogong-local}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 에서도 컨테이너가 내 PC(호스트)의 Spring 을 부를 수 있게
    depends_on:
      ai-migrate:
        condition: service_completed_successfully

  # 🤖 (선택) 수요 예측 실험: 이동평균 baseline → LightGBM (ml/README.md)
  ml:
    build: ./ml
    profiles: ["ml"]
    ports:
      - "8888:8888"
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-dev}:${DB_PASSWORD:-dev}@postgres:5432/${DB_NAME:-nansogong}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-nansogong}
      TZ: Asia/Seoul
    volumes:
      - ./ml:/workspace
    depends_on:
      postgres:
        condition: service_healthy

  # 📊 (선택) 모니터링: 내 PC 에서 돌고 있는 서버(8080)의 /actuator/prometheus 를 읽어 간다
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 에서도 컨테이너가 내 PC(호스트)를 부를 수 있게

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
