# 🖥️ 화면 컨테이너(nginx) 설정 — frontend/Dockerfile 이 사용
#   /api/*  → 같은 compose 의 서버(app:8080). 화면과 API 가 같은 주소라 CORS 가 필요 없다
#   그 외   → React 빌드 파일. 없는 경로는 index.html (화면 이동 · 새로고침)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;           # AI 응답이 길 수 있다
    }

    # 파일 이름에 해시가 붙은 빌드 결과물은 오래 캐시
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html · 서비스워커는 항상 새로 받는다 (안 그러면 배포해도 옛 화면이 남는다)
    location ~* ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
