AWSTemplateFormatVersion: '2010-09-09'
# 🧪 dev (작게): EC2 t4g.small 1대에서 docker compose 로 화면 · 서버 · Redis · 목업 · AI 서비스를 실행. DB 는 팀 공용 온프레미스 PostgreSQL
#   생성 (콘솔): CloudFormation > 스택 생성 > 새 리소스 사용(표준) > 템플릿 파일 업로드 → 이 파일
#     스택 이름  nansogong-dev  (shared 스택이 먼저 있어야 한다: GitHub OIDC 공급자 · 저장소 이름을 가져다 쓴다)
#     입력       VpcId=<기본 VPC>, SubnetId=<기본 VPC 의 서브넷>, AllowedCidr=<내 IP>/32
#     검토 화면  "사용자 지정 이름으로 IAM 리소스를 생성할 수 있음을 승인합니다" 체크
#   만든 뒤     출력 DeployRoleArn · InstanceId → GitHub Environment dev 의 AWS_DEPLOY_ROLE_ARN · DEV_INSTANCE_ID
#   prod 와 달리 RDS · ElastiCache · ALB · NAT 를 쓰지 않는다 (하루 약 $0.7)
#   → 네트워크 · 권한 · TLS 처럼 prod 에서만 생기는 문제는 여기서 확인되지 않는다 (prod 리허설로 확인)
#
#   만든 뒤 (SSM Session Manager 로 접속, infra/README.md 의 "dev 만들기")
#     sudo -iu ec2-user
#     git clone -b dev https://github.com/SongJunPyo/NanSoGong.git /opt/nansogong
#     /opt/nansogong/infra/dev/update.sh
#   이후에는 dev 에 머지할 때마다 GitHub Actions 가 update.sh 를 원격 실행한다
Description: nansogong dev (single EC2 running docker compose)

# 콘솔에서 스택을 만들 때 입력 칸을 묶어서 보여 준다 (동작에는 영향 없음)
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: '1. Network (default VPC)' }
        Parameters: [VpcId, SubnetId]
      - Label: { default: '2. Access and size' }
        Parameters: [AllowedCidr, InstanceType]

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: 인터넷 게이트웨이로 나가는 public 서브넷 (기본 VPC 의 서브넷이면 된다)
  AllowedCidr:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: 'must be an IPv4 CIDR such as 1.2.3.4/32 (check your IP at https://checkip.amazonaws.com)'
    Description: 화면(80)에 들어올 수 있는 IP (예 1.2.3.4/32). 팀원 IP 는 만든 뒤 보안 그룹에 한 줄씩 추가
  InstanceType:
    Type: String
    Default: t4g.small

Resources:
  DevSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: nansogong dev - HTTP 80 from team IPs only (shell access via SSM)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedCidr, Description: team }
      Tags:
        - { Key: Name, Value: nansogong-dev }

  DevRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore          # 접속 · Actions 원격 실행(SSM Run Command)
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly    # ECR 에서 이미지 받기
      Policies:
        - PolicyName: read-dev-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:nansogong/dev-*'

  DevInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref DevRole]

  DevInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref DevInstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref DevSecurityGroup]
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true }
      Tags:
        - { Key: Name, Value: nansogong-dev }
        - { Key: Environment, Value: dev }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker git jq
          systemctl enable --now docker
          usermod -aG docker ec2-user

          # docker compose 플러그인 (Amazon Linux 저장소에 없어서 직접 받는다)
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-aarch64
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          # 메모리 2GB 에 컨테이너 5개 → 스왑 2GB 로 여유를 둔다
          dd if=/dev/zero of=/swapfile bs=1M count=2048
          chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab

          mkdir -p /opt/nansogong && chown ec2-user:ec2-user /opt/nansogong

  # 고정 IP: EC2 를 껐다 켜도 주소가 바뀌지 않는다. 🚨 스택을 지우면 함께 반납된다 (따로 만들면 반납을 잊어 과금)
  DevEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref DevInstance
      Tags:
        - { Key: Name, Value: nansogong-dev }

  # GitHub Actions 의 dev 배포 역할: Environment dev 의 잡만, 이 EC2 에 update.sh 명령 보내기만 (infra/dev/run-remote.sh)
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nansogong-deploy-dev
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Federated: !ImportValue nansogong-GitHubOidcProviderArn }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub
                  - 'repo:${Repo}:environment:dev'      # 🚨 브랜치가 아니라 Environment 이름으로 확인한다
                  - { Repo: !ImportValue nansogong-GitHubRepository }
      Policies:
        - PolicyName: run-update-on-dev-instance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RunUpdateScriptOnDevInstanceOnly
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${DevInstance}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript'
              - Sid: ReadCommandResult
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'

Outputs:
  DeployRoleArn:
    Description: GitHub Environments(dev) 변수 AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  InstanceId:
    Description: GitHub Environments(dev) 변수 DEV_INSTANCE_ID
    Value: !Ref DevInstance
  Url:
    Value: !Sub 'http://${DevEip}'
