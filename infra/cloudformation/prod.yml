AWSTemplateFormatVersion: '2010-09-09'
# 🚀 prod 전체를 스택 하나로: 네트워크(VPC · NAT · 보안 그룹) · 데이터(RDS · Redis) · 앱(ALB · WAF · ASG · CodeDeploy · CloudFront · S3 · Route 53 · 알람)
#   생성 (콘솔): CloudFormation > 스택 생성 > 새 리소스 사용(표준) > 템플릿 파일 업로드 → 이 파일
#     스택 이름  nansogong-prod   (shared 스택이 먼저 있어야 한다: GitHub OIDC 공급자 · 저장소 이름을 가져다 쓴다)
#     입력       Environment=prod, DomainName=<도메인>, ApiDomainName=api.<도메인>, HostedZoneId=<드롭다운에서 선택>,
#                AlbCertificateArn=<서울 인증서 ARN>, CloudFrontCertificateArn=<버지니아 인증서 ARN>, AlarmEmail=<알람 받을 메일>
#                나머지는 기본값 (CloudFrontPrefixListId · DbEngineVersion 은 칸 설명대로 먼저 확인)
#     스택 옵션  "스택 실패 옵션" 에서 "성공적으로 프로비저닝된 리소스 보존" 을 고르면, 중간에 실패해도 RDS 등 다 만든 것을 지우지 않는다
#                → 원인을 고친 뒤 스택 "업데이트" 로 이어서 만들 수 있다 (기본값 "모든 스택 리소스 롤백" 이면 처음부터 30~40분 다시)
#     검토 화면  "사용자 지정 이름으로 IAM 리소스를 생성할 수 있음을 승인합니다" 체크
#   만든 뒤     출력 DeployRoleArn · CodeDeployApplication · CodeDeployDeploymentGroup · ArtifactBucket · WebBucket · DistributionId
#               → GitHub Environment prod 변수 6개
#   다 되기까지 40~50분 (RDS Multi-AZ 20~30분 → 서버 · ALB → CloudFront 10~20분. CloudFormation 이 순서를 알아서 정한다)
#   🚨 지우기 전에 S3 버킷 두 개(WebBucket · ArtifactBucket)를 비운다 (비어 있지 않으면 삭제 실패). RDS 는 마지막 스냅숏을 남긴다
#
#   요청 흐름
#     사장님 브라우저 → CloudFront(https://<도메인>)
#        ├─ /api/*  → ALB(https://api.<도메인>, WAF) → EC2(8080, private 서브넷) → RDS · ElastiCache
#        └─ 그 외   → S3 (화면 파일, CloudFront 만 읽을 수 있음)
#   화면과 API 가 같은 주소(<도메인>)라서 CORS · 쿠키 문제가 없다 (프론트는 VITE_API_BASE=/api 로 빌드)
#
#   네트워크 구조 (가용 영역 2개 = 서울 a · c)
#     public  서브넷 x2  : ALB · NAT 게이트웨이
#     private 서브넷 x2  : 서버 EC2 (밖으로 나갈 때만 NAT 사용, 밖에서 직접 들어올 수 없음)
#     data    서브넷 x2  : RDS · ElastiCache (인터넷 경로 없음)
#
#   비밀값: DB 비밀번호는 이 스택이 nansogong/<env>/db 에 자동 생성한다 (사람이 정하지 않는다)
#     API 키 · JWT 등은 nansogong/<env> 비밀에 콘솔에서 직접 넣는다 (infra/secrets/README.md)
#     서버는 배포될 때 두 비밀 + DB · Redis 주소를 합쳐 환경변수로 쓴다 (infra/codedeploy/scripts/start.sh)
#   서버 배포는 CodeDeploy 가 한다 (.github/workflows/backend.yml → infra/codedeploy/appspec.yml)
#   ASG 가 새 EC2 를 띄우면 CodeDeploy 가 마지막으로 성공한 버전을 자동으로 깔아 준다
Description: nansogong prod (VPC, NAT x2, RDS PostgreSQL Multi-AZ, ElastiCache Redis, ALB, WAF, ASG, CodeDeploy, CloudFront, S3, Route53, alarms)

# 콘솔에서 스택을 만들 때 입력 칸을 묶어서 보여 준다 (동작에는 영향 없음). 콘솔 글자는 한글이 깨질 수 있어 영어로
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: '1. Environment' }
        Parameters: [Environment]
      - Label: { default: '2. Domain and certificates (ACM certificates are created by hand)' }
        Parameters: [DomainName, ApiDomainName, HostedZoneId, CloudFrontCertificateArn, AlbCertificateArn]
      - Label: { default: '3. Network' }
        Parameters: [VpcCidr, CloudFrontPrefixListId]
      - Label: { default: '4. Database (RDS PostgreSQL)' }
        Parameters: [DbEngineVersion, DbInstanceClass, DbAllocatedStorage, DbMultiAz]
      - Label: { default: '5. Cache (ElastiCache Redis)' }
        Parameters: [CacheNodeType]
      - Label: { default: '6. App servers (Auto Scaling)' }
        Parameters: [InstanceType, AsgMinSize, AsgMaxSize]
      - Label: { default: '7. Alarms' }
        Parameters: [AlarmEmail]

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: prod
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  CloudFrontPrefixListId:
    Type: String
    Default: pl-22a6434b
    Description: 서울 리전의 CloudFront origin-facing 관리형 접두사 목록 ID. 콘솔 VPC > 관리형 접두사 목록 에서 com.amazonaws.global.cloudfront.origin-facing 을 검색해 같은 값인지 확인. ALB 는 CloudFront 에서 오는 요청만 받는다
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
  DbMultiAz:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  CacheNodeType:
    Type: String
    Default: cache.t4g.micro
  DbEngineVersion:
    Type: String
    Default: '17.11'
    Description: PostgreSQL 17 의 세부 버전. 오래된 버전은 새로 만들 수 없다 → 콘솔 RDS > 데이터베이스 생성 > PostgreSQL > 엔진 버전 목록에서 17.x 확인 (만들지 말고 취소)
  DomainName:
    Type: String
    Description: 화면 주소 (예 nansogong.com). CloudFront 에 연결
  ApiDomainName:
    Type: String
    Description: ALB 주소 (예 api.nansogong.com). CloudFront 가 /api/* 를 여기로 보낸다
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: 위 도메인의 Route 53 호스팅 영역 ID
  # 인증서는 콘솔(ACM)에서 직접 발급한다. 리전을 잘못 고른 ARN 은 스택을 만들기 전에 여기서 걸러진다
  AlbCertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:ap-northeast-2:\d{12}:certificate/[0-9a-f-]+$'
    ConstraintDescription: 'must be an ACM certificate ARN issued in Seoul (ap-northeast-2) for ApiDomainName'
    Description: ApiDomainName 용 ACM 인증서 (서울 ap-northeast-2 에서 발급)
  CloudFrontCertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:us-east-1:\d{12}:certificate/[0-9a-f-]+$'
    ConstraintDescription: 'must be an ACM certificate ARN issued in N. Virginia (us-east-1); CloudFront cannot use certificates from other regions'
    Description: DomainName 용 ACM 인증서 (🚨 버지니아 us-east-1 에서 발급해야 CloudFront 에 붙는다)
  InstanceType:
    Type: String
    Default: t4g.small                  # Graviton(arm64). 이미지도 arm64 로 빌드한다
  AsgMinSize:
    Type: Number
    Default: 2                          # 가용 영역마다 1대
  AsgMaxSize:
    Type: Number
    Default: 4
  AlarmEmail:
    Type: String
    Default: ''
    Description: CloudWatch 알람을 받을 메일 (비우면 알림 메일 없음, 메일 인증 링크를 눌러야 받기 시작)

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:
  # ════════════════════════════════════════════════════════
  # 1. 네트워크: VPC · 서브넷 · NAT · 보안 그룹
  # ════════════════════════════════════════════════════════
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - { Key: Name, Value: !Sub 'nansogong-${Environment}' }
        - { Key: Environment, Value: !Ref Environment }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Environment, Value: !Ref Environment }

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ── 서브넷 ──────────────────────────────────────────────
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 6, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub 'nansogong-${Environment}-public-a' }
  PublicSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 6, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub 'nansogong-${Environment}-public-c' }
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - { Key: Name, Value: !Sub 'nansogong-${Environment}-private-a' }
  PrivateSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - { Key: Name, Value: !Sub 'nansogong-${Environment}-private-c' }
  DataSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - { Key: Name, Value: !Sub 'nansogong-${Environment}-data-a' }
  DataSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - { Key: Name, Value: !Sub 'nansogong-${Environment}-data-c' }

  # ── 라우팅: public → 인터넷 게이트웨이 ──────────────────
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  PublicSubnetCRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetC, RouteTableId: !Ref PublicRouteTable }

  # ── NAT 게이트웨이 2개 (가용 영역마다 1개: 한쪽 영역이 죽어도 다른 쪽 서버는 밖으로 나갈 수 있다) ──
  #    서버가 Claude API · 공공데이터 · ECR · Secrets Manager 를 부를 때 쓴다. 시간당 과금이 가장 큰 항목
  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties: { Domain: vpc }
  NatEipC:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties: { Domain: vpc }
  NatA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - { Key: Name, Value: !Sub 'nansogong-${Environment}-nat-a' }
  NatC:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipC.AllocationId
      SubnetId: !Ref PublicSubnetC
      Tags:
        - { Key: Name, Value: !Sub 'nansogong-${Environment}-nat-c' }

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PrivateRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatA
  PrivateSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTableA }

  PrivateRouteTableC:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PrivateRouteC:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableC
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatC
  PrivateSubnetCRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetC, RouteTableId: !Ref PrivateRouteTableC }

  # data 서브넷은 인터넷 경로가 없는 전용 라우트 테이블
  DataRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DataSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DataSubnetA, RouteTableId: !Ref DataRouteTable }
  DataSubnetCRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DataSubnetC, RouteTableId: !Ref DataRouteTable }

  # ── 보안 그룹: CloudFront → ALB(443) → 서버(8080) → RDS(5432) · Redis(6379) ──
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - HTTPS from CloudFront only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourcePrefixListId: !Ref CloudFrontPrefixListId
      Tags:
        - { Key: Name, Value: !Sub 'nansogong-${Environment}-alb' }

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App EC2 - 8080 from ALB only (shell access via SSM, no SSH)   # 설명에는 한글을 쓸 수 없다
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - { Key: Name, Value: !Sub 'nansogong-${Environment}-app' }

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS - 5432 from app only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
      Tags:
        - { Key: Name, Value: !Sub 'nansogong-${Environment}-db' }

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache - 6379 from app only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref AppSecurityGroup
      Tags:
        - { Key: Name, Value: !Sub 'nansogong-${Environment}-redis' }

  # ════════════════════════════════════════════════════════
  # 2. 데이터: RDS PostgreSQL · ElastiCache Redis · DB 비밀번호
  # ════════════════════════════════════════════════════════
  # 🔐 DB 마스터 계정 (username · password). 비밀번호는 32자 무작위
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'nansogong/${Environment}/db'
      Description: RDS master credentials (auto-generated)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"nansogong"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\''`:;?#%&=+$ '
      Tags:
        - { Key: Environment, Value: !Ref Environment }

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub 'nansogong ${Environment} data subnets'
      SubnetIds: [!Ref DataSubnetA, !Ref DataSubnetC]

  # 로컬 docker compose(TZ=Asia/Seoul)와 같게: 매출 집계 date_trunc 등이 한국 시간 기준이 된다
  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres17
      Description: !Sub 'nansogong ${Environment} - timezone Asia/Seoul'
      Parameters:
        timezone: Asia/Seoul

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot              # 스택을 지우면 마지막 스냅숏을 남긴다 (필요 없으면 콘솔에서 스냅숏 삭제)
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub 'nansogong-${Environment}'
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion # 로컬 postgres:17-alpine · Testcontainers 와 같은 메이저 버전 17
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: !Ref DbMultiAz             # Standby 를 다른 가용 영역에 두고 장애 시 자동 전환
      DBName: nansogong
      MasterUsername: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBParameterGroupName: !Ref DbParameterGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: !If [IsProd, 7, 1]
      DeletionProtection: false           # 발표 후 스택째 지우기 위해 꺼 둔다. 오래 운영하게 되면 true
      AutoMinorVersionUpgrade: true
      Tags:
        - { Key: Environment, Value: !Ref Environment }

  # 비밀에 접속 주소도 함께 기록해 둔다 (콘솔에서 한눈에 보기 · 데모 데이터 넣을 때)
  DbSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbSecret
      TargetId: !Ref Database
      TargetType: AWS::RDS::DBInstance

  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: !Sub 'nansogong ${Environment} data subnets'
      SubnetIds: [!Ref DataSubnetA, !Ref DataSubnetC]

  # 🧠 Redis 2노드 (primary + replica, 다른 가용 영역). primary 가 죽으면 replica 가 자동 승격
  #    전송 중 암호화(TLS)를 켠다 → 서버는 REDIS_SSL=true 로 접속한다 (이 스택의 User data 가 넣어 준다)
  Redis:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub 'nansogong-${Environment}'
      ReplicationGroupDescription: !Sub 'nansogong ${Environment} redis'
      Engine: redis
      EngineVersion: '7.1'                # 오픈소스 Redis 7.0 호환 → 로컬 redis:7.0-alpine
      CacheNodeType: !Ref CacheNodeType
      NumCacheClusters: 2
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      TransitEncryptionEnabled: true
      AtRestEncryptionEnabled: true
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds:
        - !Ref RedisSecurityGroup
      Tags:
        - { Key: Environment, Value: !Ref Environment }

  # ════════════════════════════════════════════════════════
  # 3. 앱: 서버(ASG) · ALB · WAF · CodeDeploy · 화면(S3 + CloudFront) · 도메인 · 알람 · 배포 역할
  # ════════════════════════════════════════════════════════
  # ── 서버 EC2 권한 ────────────────────────────────────────
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore          # 접속은 SSM Session Manager (SSH 키 · 22번 포트 없음)
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly    # ECR 에서 서버 이미지 받기
      Policies:
        - PolicyName: nansogong-app
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadOwnEnvironmentSecretsOnly         # dev 서버는 prod 비밀을 못 읽는다
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:nansogong/${Environment}-*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:nansogong/${Environment}/db-*'
              - Sid: ReadDeployBundles                     # CodeDeploy 에이전트가 배포 묶음(zip)을 받는다
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Sid: ShipContainerLogs                     # 서버 로그 → CloudWatch Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${AppLogGroup.Arn}:*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/nansogong/${Environment}/api'
      RetentionInDays: 14

  # ── 서버 시작 템플릿 ─────────────────────────────────────
  # User data 는 "준비" 만 한다: Docker · CodeDeploy 에이전트 설치 + 인프라 주소 파일 작성
  # 서버 컨테이너는 CodeDeploy 가 띄운다 (infra/codedeploy/scripts/start.sh)
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        SecurityGroupIds:
          - !Ref AppSecurityGroup
        MetadataOptions:
          HttpTokens: required              # IMDSv2 만 허용
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub 'nansogong-${Environment}-api' }
              - { Key: Environment, Value: !Ref Environment }
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -euo pipefail
              dnf install -y docker jq ruby wget
              systemctl enable --now docker

              # CodeDeploy 에이전트 (리전 전용 버킷에서 설치)
              cd /tmp
              wget -q https://aws-codedeploy-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/latest/install
              chmod +x ./install && ./install auto
              systemctl enable --now codedeploy-agent

              # 인프라가 정한 값 (DB · Redis 주소). 비밀값은 배포 때 Secrets Manager 에서 읽는다
              mkdir -p /etc/nansogong
              cat > /etc/nansogong/infra.env <<EOF
              APP_ENV=${Environment}
              AWS_REGION=${AWS::Region}
              DB_SECRET_ID=nansogong/${Environment}/db
              DB_URL=jdbc:postgresql://${DbEndpoint}:5432/nansogong
              REDIS_HOST=${RedisEndpoint}
              REDIS_SSL=true
              LOG_GROUP=${AppLogGroup}
              EOF
              chmod 600 /etc/nansogong/infra.env
            - DbEndpoint: !GetAtt Database.Endpoint.Address
              RedisEndpoint: !GetAtt Redis.PrimaryEndPoint.Address

  # ── ALB ─────────────────────────────────────────────────
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'nansogong-${Environment}'
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetC]
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8080
      TargetType: instance
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref AlbCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # /actuator/* 는 밖에서 막는다 (헬스체크는 ALB 가 EC2 에 직접 하므로 영향 없음)
  BlockActuatorRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: ['/actuator/*'] }
      Actions:
        - Type: fixed-response
          FixedResponseConfig: { StatusCode: '403', ContentType: text/plain, MessageBody: Forbidden }

  # ── WAF (ALB 앞) ─────────────────────────────────────────
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub 'nansogong-${Environment}'
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub 'nansogong-${Environment}'
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 0
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY     # 8KB 넘는 본문(AI 요청 · 긴 JSON)을 막지 않고 기록만
                  ActionToUse: { Count: {} }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: common }
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: bad-inputs }
        - Name: AWSManagedRulesSQLiRuleSet
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesSQLiRuleSet }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: sqli }
        # 같은 사용자가 5분에 1000번 넘게 부르면 차단. CloudFront 를 거쳐 오므로 X-Forwarded-For 의 원래 IP 로 센다
        - Name: RateLimitPerClientIp
          Priority: 3
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: 1000
              AggregateKeyType: FORWARDED_IP
              ForwardedIPConfig: { HeaderName: X-Forwarded-For, FallbackBehavior: MATCH }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rate-limit }

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref Alb
      WebACLArn: !GetAtt WebAcl.Arn

  # ── Auto Scaling 그룹 ────────────────────────────────────
  # HealthCheckType EC2: 첫 배포 전에는 서버 컨테이너가 없어 ALB 헬스체크가 실패한다
  #   ELB 로 두면 ASG 가 "고장" 으로 보고 EC2 를 계속 갈아 끼우므로, EC2 상태(꺼짐 · 고장)로만 교체한다
  #   ALB 는 헬스체크를 통과한 서버에만 요청을 보내므로 사용자 영향은 없다
  Asg:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: [PrivateRouteA, PrivateRouteC, PrivateSubnetARoute, PrivateSubnetCRoute]   # NAT 경로가 생긴 뒤에 서버를 띄운다 (User data 가 dnf · CodeDeploy 에이전트를 받으려면 밖으로 나가야 한다)
    Properties:
      AutoScalingGroupName: !Sub 'nansogong-${Environment}-api'
      VPCZoneIdentifier: [!Ref PrivateSubnetA, !Ref PrivateSubnetC]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref AsgMinSize
      MaxSize: !Ref AsgMaxSize
      DesiredCapacity: !Ref AsgMinSize
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: EC2
      HealthCheckGracePeriod: 300
      Tags:
        - { Key: Environment, Value: !Ref Environment, PropagateAtLaunch: true }

  CpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref Asg
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification: { PredefinedMetricType: ASGAverageCPUUtilization }
        TargetValue: 60

  # ── CodeDeploy ──────────────────────────────────────────
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - { Id: expire-old-bundles, Status: Enabled, ExpirationInDays: 30 }

  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codedeploy.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole
      Policies:
        - PolicyName: launch-template-asg       # 시작 템플릿을 쓰는 ASG 에 필요한 추가 권한
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ec2:RunInstances, ec2:CreateTags]
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt InstanceRole.Arn

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub 'nansogong-${Environment}'
      ComputePlatform: Server

  # 한 대씩 ALB 에서 빼고 → 새 버전 설치 → 헬스체크 통과 → 다시 ALB 에 넣는다 (끊김 없이 교체)
  # 실패하면 직전 버전으로 자동 롤백
  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub 'nansogong-${Environment}-api'
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      AutoScalingGroups: [!Ref Asg]
      DeploymentConfigName: CodeDeployDefault.OneAtATime
      DeploymentStyle:
        DeploymentType: IN_PLACE
        DeploymentOption: WITH_TRAFFIC_CONTROL
      LoadBalancerInfo:
        TargetGroupInfoList:
          - Name: !GetAtt TargetGroup.TargetGroupName
      AutoRollbackConfiguration:
        Enabled: true
        Events: [DEPLOYMENT_FAILURE]

  # ── 화면: S3 + CloudFront ───────────────────────────────
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'nansogong-${Environment}-web'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 화면 주소(/sales, /inventory/3 등)를 새로고침해도 index.html 을 주도록 (React 화면 이동)
  #   점(.)이 없는 경로만 바꾼다 → /assets/app.js · /sw.js 같은 파일은 그대로
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'nansogong-${Environment}-spa-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: rewrite extensionless paths to /index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'nansogong ${Environment}'
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200            # 한국 포함 · 남미 등 제외로 조금 저렴
        ViewerCertificate:
          AcmCertificateArn: !Ref CloudFrontCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !Ref ApiDomainName
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              HTTPSPort: 443
              OriginReadTimeout: 60             # AI 응답이 길 수 있다
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6        # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad      # Managed-CachingDisabled (API 는 캐시하지 않는다)
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader (쿠키 · 헤더 전달)

  # ── 도메인 ──────────────────────────────────────────────
  SiteDnsA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2          # CloudFront 고정값
  SiteDnsAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
  ApiDns:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID

  # ── CloudWatch 알람 ─────────────────────────────────────
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'nansogong-${Environment}-alarms'
  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  AlarmNoHealthyHost:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'nansogong-${Environment}-no-healthy-host'
      AlarmDescription: 정상 서버가 한 대도 없다 (서비스 중단)
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  AlarmUnhealthyHost:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'nansogong-${Environment}-unhealthy-host'
      AlarmDescription: 헬스체크에 실패한 서버가 있다
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  AlarmTarget5xx:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'nansogong-${Environment}-api-5xx'
      AlarmDescription: 서버 5xx 응답이 5분에 10건 이상
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  AlarmDbCpu:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'nansogong-${Environment}-db-cpu'
      AlarmDescription: RDS CPU 80% 이상이 10분 지속
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmTopic]

  AlarmDbStorage:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'nansogong-${Environment}-db-storage'
      AlarmDescription: RDS 남은 저장 공간 2GB 미만
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2000000000
      ComparisonOperator: LessThanThreshold
      AlarmActions: [!Ref AlarmTopic]

  # ── GitHub Actions 의 배포 역할 ──────────────────────────
  #   Environment prod 의 잡만: 배포 묶음 S3 업로드 · CodeDeploy 배포 · 화면 S3 업로드 · CloudFront 캐시 비우기
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'nansogong-deploy-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Federated: !ImportValue nansogong-GitHubOidcProviderArn }
            Action: sts:AssumeRoleWithWebIdentity
            # 🚨 브랜치가 아니라 Environment 이름으로 확인한다
            #   GitHub sub 는 예전 모양(repo:소유자/저장소:...)과 새 모양(repo:소유자@ID/저장소@ID:...)이 있어서 둘 다 받는다 (shared.yml · dev.yml 과 같음)
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub
                    - 'repo:${Repo}:environment:${Environment}'
                    - { Repo: !ImportValue nansogong-GitHubRepository }
                  - !Sub
                    - 'repo:${Owner}@*/${Name}@*:environment:${Environment}'
                    - Owner: !Select [0, !Split ['/', !ImportValue nansogong-GitHubRepository]]
                      Name: !Select [1, !Split ['/', !ImportValue nansogong-GitHubRepository]]
      Policies:
        - PolicyName: deploy-nansogong
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UploadDeployBundle
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Sid: StartAndWatchCodeDeploy
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource:
                  - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${CodeDeployApplication}'
                  - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${CodeDeployApplication}/${DeploymentGroup}'
                  - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*'
              - Sid: UploadWeb
                Effect: Allow
                Action: [s3:ListBucket, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !GetAtt WebBucket.Arn
                  - !Sub '${WebBucket.Arn}/*'
              - Sid: InvalidateCloudFront
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  DeployRoleArn:
    Description: GitHub Environments 변수 AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  SiteUrl:
    Value: !Sub 'https://${DomainName}'
  AsgName:
    Value: !Ref Asg
  CodeDeployApplication:
    Description: GitHub Environments 변수 CODEDEPLOY_APP
    Value: !Ref CodeDeployApplication
  CodeDeployDeploymentGroup:
    Description: GitHub Environments 변수 CODEDEPLOY_GROUP
    Value: !Ref DeploymentGroup
  ArtifactBucket:
    Description: GitHub Environments 변수 ARTIFACT_BUCKET
    Value: !Ref ArtifactBucket
  WebBucket:
    Description: GitHub Environments 변수 WEB_BUCKET
    Value: !Ref WebBucket
  DistributionId:
    Description: GitHub Environments 변수 CF_DISTRIBUTION_ID
    Value: !Ref Distribution
  AppLogGroup:
    Value: !Ref AppLogGroup
  DbEndpoint:
    Description: RDS 주소 (서버 설정에는 이미 들어가 있다)
    Value: !GetAtt Database.Endpoint.Address
  RedisEndpoint:
    Value: !GetAtt Redis.PrimaryEndPoint.Address
  DbSecretArn:
    Description: DB 계정 비밀 (Secrets Manager nansogong/<env>/db)
    Value: !Ref DbSecret
