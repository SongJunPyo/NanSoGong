# AI 서비스(FastAPI) CI/CD — 지금은 dev 만 (운영 배포 구성은 따로 설계: docs/rules/architecture.md 배포 범위)
#
#   PR (→ dev / main)   pytest 만
#   dev 에 머지          pytest → arm64 이미지 빌드 → ECR nansogong-ai → dev EC2 갱신 (SSM 으로 infra/dev/update.sh ai <태그>)
#
# 🧱 이미지 이름표는 backend 와 같은 방식: ai 폴더 내용의 지문(git tree 해시). 내용이 같으면 다시 빌드하지 않는다
#
# 필요한 값 (backend · frontend 와 같은 값을 쓴다. 자세한 건 infra/README.md)
#   Variables (저장소 공통)  AWS_BUILD_ROLE_ARN   ← shared 스택에 nansogong-ai 저장소 · 권한이 추가되어 있어야 한다
#   Environments > dev      AWS_DEPLOY_ROLE_ARN, DEV_INSTANCE_ID
#   값을 넣기 전에는 빌드 · 배포가 "건너뜀" 으로 끝나고 테스트만 돈다
name: ai

on:
  push:
    branches: [main, dev]
    paths: ['ai/**', '.github/workflows/ai.yml']          # AI 서비스가 바뀐 push 에서만
  pull_request:
    branches: [main, dev]
    paths: ['ai/**', '.github/workflows/ai.yml']
  workflow_dispatch:

permissions:
  id-token: write         # OIDC: AWS 키 없이 역할로 들어간다
  contents: read

env:
  REPOSITORY: nansogong-ai
  AWS_REGION: ap-northeast-2

defaults:
  run:
    working-directory: ai

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'        # ai/Dockerfile 과 같은 버전
          cache: pip
          cache-dependency-path: |
            ai/requirements.txt
            ai/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  build:
    needs: test
    if: vars.AWS_BUILD_ROLE_ARN != '' && github.event_name != 'pull_request' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        run: echo "tag=tree-$(git rev-parse HEAD:ai | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - id: exists
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag=${{ steps.meta.outputs.tag }} > /dev/null 2>&1; then
            echo "같은 코드로 만든 이미지가 이미 있다 → 빌드 건너뜀"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      # pip install 이 arm64 로 실행되도록 에뮬레이터(QEMU)를 켠다
      #   backend 는 컴파일을 빌드 PC 아키텍처에서 하고 결과만 arm64 로 옮겨서 필요 없지만, Python 은 설치 자체를 arm64 로 해야 한다
      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ai
          platforms: linux/arm64      # dev EC2(t4g, Graviton) 용
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    concurrency: { group: deploy-dev, cancel-in-progress: false }   # backend · frontend 와 같은 그룹 → dev EC2 갱신이 겹치지 않는다
    defaults:
      run:
        working-directory: .
    steps:
      - if: vars.DEV_INSTANCE_ID == ''
        run: echo "dev 환경 변수 DEV_INSTANCE_ID 가 아직 없어서 배포를 건너뜁니다"
      - if: vars.DEV_INSTANCE_ID != ''
        uses: actions/checkout@v4
      - if: vars.DEV_INSTANCE_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - if: vars.DEV_INSTANCE_ID != ''
        env:
          DEV_INSTANCE_ID: ${{ vars.DEV_INSTANCE_ID }}
        run: bash infra/dev/run-remote.sh ai ${{ needs.build.outputs.tag }}
