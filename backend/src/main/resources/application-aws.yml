# ☁️ AWS 공통 설정 (dev · prod 둘 다): EC2 에서 SPRING_PROFILES_ACTIVE=aws,dev 또는 aws,prod 로 켠다
#   → 이 파일이 먼저 깔리고, 뒤에 적은 dev / prod 파일이 그 위를 덮어쓴다
# 값은 전부 환경변수로만 받는다. 🚨 기본값이 없으므로 하나라도 빠지면 앱이 뜨지 않는다 (Fail-Fast)
#   → 로컬 기본값(localhost DB, 데모 JWT 키)으로 AWS 서버가 조용히 떠 버리는 사고를 막는다
# 환경변수는 CodeDeploy 가 서버를 띄울 때 넣는다 (infra/codedeploy/scripts/start.sh)
#   DB_URL  REDIS_HOST  REDIS_SSL=true   ← prod 스택(infra/cloudformation/prod.yml)이 RDS · ElastiCache 주소로 채운다
#   DB_USER  DB_PASSWORD                 ← prod 스택이 만든 비밀 nansogong/prod/db
#   JWT_SECRET  CREDENTIAL_ENCRYPTION_KEY  ANTHROPIC_API_KEY  DATA_GO_KR_SERVICE_KEY  NAVER_CLIENT_ID  NAVER_CLIENT_SECRET
#   POS_BASE_URL  SUPPLIER_BASE_URL  MYDATA_BASE_URL  VERIFICATION_MODE  CORS_ALLOWED_ORIGINS=https://<도메인>
#   (목록 전체는 infra/secrets/README.md 의 키 목록)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL:false}   # ElastiCache 전송 중 암호화(prod 스택은 켜 둠) → prod 스택이 REDIS_SSL=true 를 넣는다
      # ElastiCache AUTH 토큰을 켰다면 아래 주석을 풀고 Secrets Manager 에 REDIS_PASSWORD 를 넣는다
      # password: ${REDIS_PASSWORD}
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
  verification:
    mode: ${VERIFICATION_MODE}            # MVP 는 dev · prod 모두 mock. 실연동 후 real
  crypto:
    credential-key: ${CREDENTIAL_ENCRYPTION_KEY}
  external:
    data-go-kr-service-key: ${DATA_GO_KR_SERVICE_KEY}
    nts-base-url: ${NTS_BASE_URL:https://api.odcloud.kr/api/nts-businessman/v1}
    kma-base-url: ${KMA_BASE_URL:https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
    holiday-base-url: ${HOLIDAY_BASE_URL:https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService}
    naver-datalab-base-url: ${NAVER_DATALAB_BASE_URL:https://openapi.naver.com/v1/datalab}
    naver-client-id: ${NAVER_CLIENT_ID}
    naver-client-secret: ${NAVER_CLIENT_SECRET}
    pos-base-url: ${POS_BASE_URL}         # MVP 목업 서버 주소 (AWS 에 목업을 어디에 띄울지 정한 뒤 입력)
    supplier-base-url: ${SUPPLIER_BASE_URL}
    mydata-base-url: ${MYDATA_BASE_URL}

logging:
  level:
    com.nansogong: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: "OFF"      # 실제 값(개인정보)이 로그에 남는다
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: "OFF"   # AI 에 보낸 매장 정보가 통째로 남는다
