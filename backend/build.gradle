plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nansogong'
version = '0.0.1-SNAPSHOT'

// ☕ 팀원 PC 에 어떤 JDK 가 깔려 있든, Gradle 이 Java 21 로 컴파일한다 (없으면 settings.gradle 의 foojay 가 자동 다운로드)
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Spring AI: BOM = "이 버전들끼리는 서로 맞는다" 는 버전 목록표 (아래 스타터에는 버전을 따로 적지 않는다)
dependencyManagement {
	imports {
		mavenBom 'org.springframework.ai:spring-ai-bom:2.0.1'
	}
}

dependencies {
	// 🌐 웹 · 데이터
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'     // 외부 API 호출 (common/ExternalApiConfig)
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'      // ElastiCache(Redis)
	runtimeOnly 'org.postgresql:postgresql'                                        // RDS(PostgreSQL)

	// 🗂️ DB 표 변경 이력 관리: resources/db/migration 의 SQL 을 로컬 · dev · prod 에 같은 순서로 적용한다
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// 🔐 인증: Spring Security + JWT (리소스 서버가 Bearer 토큰을 검사한다)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// ⏰ @Scheduled 를 서버 여러 대(ASG)에서 돌려도 한 대에서만 실행되게 잠근다
	implementation 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'

	// 🤖 AI: Claude API (Spring AI ChatClient)
	implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'

	// 📊 모니터링: /actuator/prometheus
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// 📖 API 문서: Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// 🧪 테스트: JUnit 5 + Testcontainers (테스트할 때마다 진짜 PostgreSQL · Redis 컨테이너를 띄운다. Docker 필요)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
