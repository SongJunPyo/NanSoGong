# 🧪 AWS dev EC2 전용 덧씌우기 파일 (내 PC 에서는 쓰지 않는다)
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d   ← infra/dev/update.sh 가 실행
#   docker-compose.yml 위에 아래 내용만 바꾼다
#     - 서버 · 화면 · AI 서비스: EC2 에서 빌드하지 않고 GitHub Actions 가 ECR 에 올린 arm64 이미지를 받는다
#     - AI 서비스(ai-api)는 ECR 에 이미지가 생긴 뒤부터 update.sh 가 켠다 (COMPOSE_PROFILES=ai)
#     - 화면(web, nginx)을 80 포트로 연다 → http://<dev 고정 IP> 하나로 화면과 /api 를 함께 본다
#     - DB 는 팀 공용 온프레미스 PostgreSQL 을 쓴다 → postgres 컨테이너는 띄우지 않는다 (DB_URL · DB_USER · DB_PASSWORD 는 nansogong/dev 비밀)
#     - Redis · 목업 · 서버 포트는 밖에 열지 않는다 (같은 EC2 안에서만 통신)
#     - 비밀값(.env)은 Secrets Manager 의 nansogong/dev 에서 update.sh 가 만든다
#   🚨 !reset · !override 문법은 docker compose v2.24.4 이상 필요 (dev EC2 는 infra/cloudformation/dev.yml 이 설치)
services:
  # 🐘 dev 에서는 띄우지 않는다: 켜지 않는 프로필에 넣고, 아래 app 의 depends_on 에서 뺀다
  postgres:
    profiles: ["local-db"]
    ports: !reset []

  redis:
    restart: always
    ports: !reset []

  mock:
    restart: always
    ports: !reset []

  app:
    image: ${ECR_REGISTRY:?ECR_REGISTRY 없음 - infra/dev/update.sh 로 실행}/nansogong-api:${API_TAG:?API_TAG 없음}
    pull_policy: always
    restart: always
    ports: !reset []
    depends_on: !override                         # postgres 컨테이너를 기다리지 않는다 (온프레미스 DB)
      redis:
        condition: service_healthy
      mock:
        condition: service_started
    environment:
      # 회원 인증: 실제 값은 환경변수/Secrets에서만 전달한다.
      VERIFICATION_MODE: ${VERIFICATION_MODE:-mock}
      SENS_SERVICE_ID: ${SENS_SERVICE_ID:-}
      SENS_ACCESS_KEY: ${SENS_ACCESS_KEY:-}
      SENS_SECRET_KEY: ${SENS_SECRET_KEY:-}
      SENS_FROM: ${SENS_FROM:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      SPRING_PROFILES_ACTIVE: dev                 # application-dev.yml: Swagger 켜기 (DB 는 온프레미스, Redis 는 같은 EC2 의 컨테이너라 aws 프로필은 쓰지 않는다)
      # 비어 있으면 로컬 기본값(postgres 컨테이너 · dev/dev)으로 조용히 붙으려다 실패하므로, 배포 단계에서 바로 멈추게 한다
      DB_URL: ${DB_URL:?nansogong/dev 비밀에 DB_URL 필요 (온프레미스 DB)}
      DB_USER: ${DB_USER:?nansogong/dev 비밀에 DB_USER 필요}
      DB_PASSWORD: ${DB_PASSWORD:?nansogong/dev 비밀에 DB_PASSWORD 필요}
      JWT_SECRET: ${JWT_SECRET:?nansogong/dev 비밀에 JWT_SECRET 필요}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?nansogong/dev 비밀에 CREDENTIAL_ENCRYPTION_KEY 필요}
      AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul -XX:MaxRAMPercentage=35   # 메모리 2GB 를 Redis · 목업 · 화면 · AI 와 나눠 쓴다

  # 🧠 AI 서비스: 포트를 밖에 열지 않는다 (같은 EC2 의 app 만 http://ai-api:8000 으로 부른다)
  #    AI_TAG 가 없을 때(이미지가 아직 없을 때)는 ai 프로필이 꺼져 있어서 뜨지 않는다 → 기본값으로 오류만 막는다
  ai-api:
    image: ${ECR_REGISTRY}/nansogong-ai:${AI_TAG:-not-deployed}
    pull_policy: always
    restart: always
    ports: !reset []
    mem_limit: 256m                               # 메모리 2GB 를 나눠 쓴다. 지금은 틀만 있어 100MB 안팎. LangGraph 워커를 붙일 때 EC2 크기와 함께 다시 정한다

  web:
    image: ${ECR_REGISTRY}/nansogong-web:${WEB_TAG:?WEB_TAG 없음}
    profiles: !reset []                          # dev 에서는 항상 띄운다
    pull_policy: always
    restart: always
    ports: !override
      - "80:80"
